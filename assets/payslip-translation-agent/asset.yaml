apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: payslip-translation-agent
  description: AI agent that translates payslip pay codes into all major European languages, explains each component in plain language, answers follow-up questions, generates translated PDFs, and compares payslips across periods.

provides:
  apis:
    - name: payslip-translation-agent
      kind: a2a
      ordId: customer.build:apiResource:payslip-translation-cd9de.payslip-translation-agent:v1

requires:
  - name: sap-sf-ecemployeecentralpayroll-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:payslip-translation-cd9de.sap-sf-ecemployeecentralpayroll-mcp-server:v1
  - name: sap-sf-eccompensationinformation-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:payslip-translation-cd9de.sap-sf-eccompensationinformation-mcp-server:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
